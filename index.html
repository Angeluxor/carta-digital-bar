<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LUMIÈRE | Carta Digital & Cocktails</title>
  <meta name="description" content="Carta digital moderna, rápida e interactiva para restaurante y coctelería de autor." />
  
  <!-- Favicon SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍸</text></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: {
              300: '#FDE68A',
              400: '#FBBF24',
              500: '#F59E0B',
              600: '#D97706',
            },
            night: {
              950: '#070A0F',
              900: '#0B0F17',
              850: '#0F1522',
              800: '#141D2C',
              700: '#1E293B',
              600: '#334155'
            }
          },
          fontFamily: {
            brand: ['Cinzel', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel para ejecución instantánea sin build step -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Ocultar barra de scroll para navegación limpia en móviles */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-animate {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="bg-stone-100 dark:bg-night-950 text-slate-800 dark:text-slate-100 transition-colors duration-300 antialiased min-h-screen select-none md:select-auto">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // CONFIGURACIÓN DE CONEXIÓN CON GOOGLE SHEETS
    // Pega aquí el Sheet ID de tu cliente cuando esté listo:
    const GOOGLE_SHEET_ID = ""; // Ej: "1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms"
    const SHEET_TAB_NAME = "Carta";
    const API_ENDPOINT = GOOGLE_SHEET_ID 
      ? `https://opensheet.elk.sh/${GOOGLE_SHEET_ID}/${SHEET_TAB_NAME}` 
      : null;

    // Catálogo demo de respaldo (se muestra si aún no configuras tu Google Sheet o no hay internet)
    const DEMO_ITEMS = [
      {
        id: "1",
        categoria: "Cócteles de Autor",
        nombre: "Smoked Old Fashioned",
        descripcion: "Bourbon reposado, bitter angostura, piel de naranja macerada y ahumado en mesa con virutas de roble.",
        precio: "$14.50",
        disponible: "TRUE",
        destacado: "TRUE",
        maridaje_notas: "Notas intensas a madera, caramelo y cítricos. Maridaje sugerido: Charcutería curada o carnes maduradas.",
        imagen_url: "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "2",
        categoria: "Cócteles de Autor",
        nombre: "Velvet Passion Martini",
        descripcion: "Vodka infusionado en vainilla, maracuyá silvestre, licor de saúco y shot de prosecco brut.",
        precio: "$13.00",
        disponible: "TRUE",
        destacado: "FALSE",
        maridaje_notas: "Perfil tropical equilibrado con acidez chispeante. Perfecto como cóctel de bienvenida.",
        imagen_url: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "3",
        categoria: "Cócteles de Autor",
        nombre: "Negroni Especiado",
        descripcion: "Gin premium botánico, Campari macerado con cardamomo y Vermouth rosso artesanal.",
        precio: "$12.00",
        disponible: "FALSE", // AGOTADO
        destacado: "FALSE",
        maridaje_notas: "Amargor sedoso con notas cálidas de cardamomo. Va con quesos azules y frutos secos.",
        imagen_url: "https://images.unsplash.com/photo-1556881286-fc6915169721?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "4",
        categoria: "Cervezas Artesanales",
        nombre: "Double IPA Cascade",
        descripcion: "Lúpulo fresco con aromas intensos a pino, durazno y pomelo. 7.5% ABV.",
        precio: "$8.00",
        disponible: "TRUE",
        destacado: "FALSE",
        maridaje_notas: "Ideal para acompañar hamburguesas trufadas, papas rústicas o tacos de costilla.",
        imagen_url: "https://images.unsplash.com/photo-1535958636474-b021ee887b13?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "5",
        categoria: "Cervezas Artesanales",
        nombre: "Oatmeal Stout Nitro",
        descripcion: "Cerveza negra cremosa con notas de café tostado, cacao amargo y final sedoso. 6.2% ABV.",
        precio: "$8.50",
        disponible: "TRUE",
        destacado: "TRUE",
        maridaje_notas: "Combina a la perfección con postres de chocolate, tartas o cortes ahumados.",
        imagen_url: "https://images.unsplash.com/photo-1608270586620-248524c67de9?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "6",
        categoria: "Entradas & Tapas",
        nombre: "Carpaccio de Salmón Trufado",
        descripcion: "Láminas finas de salmón fresco, aceite de trufa blanca, alcaparras baby crujientes y láminas de Parmigiano.",
        precio: "$16.50",
        disponible: "TRUE",
        destacado: "TRUE",
        maridaje_notas: "Fresco, untuoso y elegante. Marida perfecto con vinos blancos secos o Gin Tonic cítrico.",
        imagen_url: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "7",
        categoria: "Entradas & Tapas",
        nombre: "Croquetas de Jamón Ibérico (4 uds)",
        descripcion: "Bechamel cremosa infusionada en hueso de jamón de bellota, rebozado panko ultra crocante.",
        precio: "$11.00",
        disponible: "TRUE",
        destacado: "FALSE",
        maridaje_notas: "Servir calientes con copa de cerveza artesanal o vermú de la casa.",
        imagen_url: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: "8",
        categoria: "Platos Fuertes",
        nombre: "Costillar BBQ Bourbon Glaze",
        descripcion: "Cocción lenta de 14 horas, glaseado brillante de BBQ casera de bourbon y papas rústicas al romero.",
        precio: "$23.50",
        disponible: "TRUE",
        destacado: "TRUE",
        maridaje_notas: "Carne suave que se desprende del hueso. Maridaje recomendado: Vino Tinto Syrah o Malbec.",
        imagen_url: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80"
      }
    ];

    function App() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedCategory, setSelectedCategory] = useState("Todas");
      const [searchTerm, setSearchTerm] = useState("");
      const [darkMode, setDarkMode] = useState(true);
      const [activeItem, setActiveItem] = useState(null);
      const [isUsingDemoData, setIsUsingDemoData] = useState(false);

      // Gestión de Modo Oscuro en etiqueta <html>
      useEffect(() => {
        const root = document.documentElement;
        if (darkMode) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      }, [darkMode]);

      // Carga de datos de la API de Google Sheets
      useEffect(() => {
        if (!API_ENDPOINT) {
          setItems(DEMO_ITEMS);
          setIsUsingDemoData(true);
          setLoading(false);
          return;
        }

        fetch(API_ENDPOINT)
          .then(res => {
            if (!res.ok) throw new Error("Error en red al leer Google Sheet");
            return res.json();
          })
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              setItems(data);
              setIsUsingDemoData(false);
            } else {
              setItems(DEMO_ITEMS);
              setIsUsingDemoData(true);
            }
          })
          .catch(err => {
            console.warn("Usando datos locales demo:", err.message);
            setItems(DEMO_ITEMS);
            setIsUsingDemoData(true);
          })
          .finally(() => setLoading(false));
      }, []);

      // Categorías dinámicas
      const categories = useMemo(() => {
        const set = new Set();
        items.forEach(i => {
          if (i.categoria && i.categoria.trim()) {
            set.add(i.categoria.trim());
          }
        });
        return ["Todas", ...Array.from(set)];
      }, [items]);

      // Filtro reactivo por categoría y búsqueda
      const filteredItems = useMemo(() => {
        return items.filter(item => {
          const matchCat = selectedCategory === "Todas" || item.categoria === selectedCategory;
          const query = searchTerm.toLowerCase().trim();
          if (!query) return matchCat;

          const matchName = item.nombre && item.nombre.toLowerCase().includes(query);
          const matchDesc = item.descripcion && item.descripcion.toLowerCase().includes(query);
          const matchNotes = item.maridaje_notas && item.maridaje_notas.toLowerCase().includes(query);

          return matchCat && (matchName || matchDesc || matchNotes);
        });
      }, [items, selectedCategory, searchTerm]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header Superior Sticky */}
          <header className="sticky top-0 z-30 bg-white/90 dark:bg-night-950/90 backdrop-blur-md border-b border-stone-200 dark:border-night-800 transition-colors">
            <div className="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-xl">🍸</span>
                  <h1 className="text-xl md:text-2xl font-bold tracking-widest font-brand text-stone-900 dark:text-gold-400">
                    LUMIÈRE
                  </h1>
                </div>
                <p className="text-[11px] tracking-wider uppercase text-stone-500 dark:text-stone-400 font-medium">
                  Cocktails & Bistró Moderno
                </p>
              </div>

              {/* Botón Switch Modo Noche / Día */}
              <button
                onClick={() => setDarkMode(!darkMode)}
                aria-label="Cambiar tema de color"
                className="p-2.5 rounded-full bg-stone-100 dark:bg-night-850 text-stone-700 dark:text-gold-400 border border-stone-200 dark:border-night-700 hover:scale-105 active:scale-95 transition-all shadow-sm"
              >
                {darkMode ? (
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                  </svg>
                ) : (
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                  </svg>
                )}
              </button>
            </div>

            {/* Barra de Búsqueda */}
            <div className="max-w-4xl mx-auto px-4 pb-2.5">
              <div className="relative">
                <input
                  type="text"
                  placeholder="Buscar cóctel, plato, trufa, bourbon..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full bg-stone-100 dark:bg-night-850 text-stone-900 dark:text-stone-100 text-sm rounded-xl pl-10 pr-9 py-2.5 border border-stone-200 dark:border-night-700 focus:border-gold-500 focus:outline-none transition-all placeholder-stone-400 dark:placeholder-stone-500"
                />
                <svg className="w-4 h-4 text-stone-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                {searchTerm && (
                  <button 
                    onClick={() => setSearchTerm("")}
                    className="absolute right-3 top-2.5 text-xs text-stone-400 hover:text-stone-700 dark:hover:text-white p-1"
                  >
                    ✕
                  </button>
                )}
              </div>
            </div>

            {/* Selector de Categorías (Pills con scroll horizontal fluido) */}
            <div className="max-w-4xl mx-auto px-4 pb-3 flex space-x-2 overflow-x-auto no-scrollbar">
              {categories.map((cat) => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-4 py-1.5 rounded-full text-xs whitespace-nowrap transition-all duration-200 ${
                    selectedCategory === cat
                      ? "bg-gold-500 text-stone-950 font-bold shadow-md shadow-gold-500/20 scale-[1.02]"
                      : "bg-stone-200/70 dark:bg-night-850 text-stone-600 dark:text-stone-400 font-medium hover:bg-stone-300 dark:hover:bg-night-800"
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>
          </header>

          {/* Banner discreto si está activo el modo demo */}
          {isUsingDemoData && (
            <aside className="bg-amber-500/10 border-b border-amber-500/20 px-4 py-1.5 text-center text-[11px] text-amber-700 dark:text-gold-300">
              Modo demostración activo. Vincula tu Google Sheet en <code className="bg-amber-500/20 px-1 py-0.5 rounded font-mono">GOOGLE_SHEET_ID</code>.
            </aside>
          )}

          {/* Grid de Ítems de la Carta */}
          <main className="flex-1 max-w-4xl mx-auto px-4 py-5 w-full">
            {loading ? (
              <div className="flex flex-col items-center justify-center py-24 space-y-3">
                <div className="w-8 h-8 border-2 border-gold-500 border-t-transparent rounded-full animate-spin"></div>
                <p className="text-xs tracking-wider uppercase text-stone-400">Cargando carta en vivo...</p>
              </div>
            ) : filteredItems.length === 0 ? (
              <div className="text-center py-20">
                <div className="text-3xl mb-2">🔍</div>
                <p className="text-stone-500 dark:text-stone-400 text-sm">No encontramos ningún producto que coincida.</p>
                <button
                  onClick={() => { setSelectedCategory("Todas"); setSearchTerm(""); }}
                  className="mt-3 text-xs text-gold-600 dark:text-gold-400 font-medium underline"
                >
                  Restablecer filtros
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                {filteredItems.map((item) => {
                  const isAvailable = String(item.disponible).trim().toLowerCase() === "true";
                  const isFeatured = String(item.destacado).trim().toLowerCase() === "true";

                  return (
                    <article
                      key={item.id || item.nombre}
                      onClick={() => setActiveItem(item)}
                      className={`group relative flex flex-col justify-between p-4 rounded-2xl bg-white dark:bg-night-900 border border-stone-200 dark:border-night-800/80 shadow-sm hover:border-gold-500/40 hover:shadow-md transition-all cursor-pointer ${
                        !isAvailable ? "opacity-60 grayscale-[50%]" : ""
                      }`}
                    >
                      <div className="flex gap-3.5">
                        {/* Miniatura visual */}
                        {item.imagen_url && (
                          <div className="w-20 h-20 rounded-xl overflow-hidden flex-shrink-0 bg-stone-200 dark:bg-night-800 border border-stone-100 dark:border-night-700">
                            <img
                              src={item.imagen_url}
                              alt={item.nombre}
                              className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                              loading="lazy"
                            />
                          </div>
                        )}

                        <div className="flex-1 min-w-0">
                          <div className="flex items-start justify-between gap-2">
                            <h2 className="text-sm md:text-base font-semibold text-stone-900 dark:text-stone-100 truncate">
                              {item.nombre}
                            </h2>
                            <span className="text-sm md:text-base font-bold text-stone-900 dark:text-gold-400 font-mono flex-shrink-0">
                              {item.precio}
                            </span>
                          </div>

                          <p className="text-xs text-stone-500 dark:text-stone-400 mt-1 line-clamp-2 leading-relaxed">
                            {item.descripcion}
                          </p>
                        </div>
                      </div>

                      {/* Pie de tarjeta con badges */}
                      <div className="flex items-center justify-between mt-3 pt-2.5 border-t border-stone-100 dark:border-night-800">
                        <div className="flex items-center gap-1.5">
                          {isFeatured && (
                            <span className="px-2 py-0.5 text-[10px] font-semibold bg-amber-500/10 text-amber-700 dark:text-gold-400 rounded-md border border-amber-500/20">
                              ★ Recomendado
                            </span>
                          )}
                          {!isAvailable && (
                            <span className="px-2 py-0.5 text-[10px] font-semibold bg-rose-500/10 text-rose-600 dark:text-rose-400 rounded-md border border-rose-500/20">
                              Agotado
                            </span>
                          )}
                        </div>

                        {item.maridaje_notas && (
                          <span className="text-[11px] text-gold-600 dark:text-gold-400 font-medium flex items-center gap-1">
                            Ver notas
                            <svg className="w-3 h-3 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
                            </svg>
                          </span>
                        )}
                      </div>
                    </article>
                  );
                })}
              </div>
            )}
          </main>

          {/* Modal / Ficha Desplegable */}
          {activeItem && (
            <div 
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
              onClick={() => setActiveItem(null)}
            >
              <div 
                className="bg-white dark:bg-night-900 rounded-3xl max-w-md w-full overflow-hidden shadow-2xl border border-stone-200 dark:border-night-700 modal-animate"
                onClick={(e) => e.stopPropagation()}
              >
                {activeItem.imagen_url && (
                  <div className="w-full h-48 overflow-hidden relative">
                    <img
                      src={activeItem.imagen_url}
                      alt={activeItem.nombre}
                      className="w-full h-full object-cover"
                    />
                    <button
                      onClick={() => setActiveItem(null)}
                      aria-label="Cerrar modal"
                      className="absolute top-3.5 right-3.5 w-8 h-8 rounded-full bg-black/60 text-white flex items-center justify-center hover:bg-black transition active:scale-90"
                    >
                      ✕
                    </button>
                  </div>
                )}

                <div className="p-6">
                  <div className="flex justify-between items-baseline gap-2 mb-2">
                    <h3 className="text-xl font-bold font-brand text-stone-900 dark:text-gold-400">
                      {activeItem.nombre}
                    </h3>
                    <span className="text-lg font-bold font-mono text-stone-900 dark:text-white">
                      {activeItem.precio}
                    </span>
                  </div>

                  <p className="text-sm text-stone-600 dark:text-stone-300 mb-4 leading-relaxed">
                    {activeItem.descripcion}
                  </p>

                  {activeItem.maridaje_notas && (
                    <div className="p-3.5 rounded-xl bg-gold-500/10 border border-gold-500/20 text-xs">
                      <span className="font-semibold block text-gold-700 dark:text-gold-400 mb-1 flex items-center gap-1.5">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Notas de Cata & Maridaje:
                      </span>
                      <p className="text-stone-700 dark:text-stone-300">
                        {activeItem.maridaje_notas}
                      </p>
                    </div>
                  )}

                  <button
                    onClick={() => setActiveItem(null)}
                    className="mt-6 w-full py-3 rounded-xl bg-stone-100 dark:bg-night-800 text-stone-700 dark:text-stone-200 font-semibold text-xs tracking-wider uppercase hover:bg-stone-200 dark:hover:bg-night-700 transition active:scale-98"
                  >
                    Volver a la carta
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer Simple y Elegante */}
          <footer className="mt-auto py-5 text-center text-xs text-stone-400 dark:text-stone-500 border-t border-stone-200 dark:border-night-800/80">
            <p>Precios con IVA incluido • Propina sugerida voluntaria</p>
            <p className="mt-1 text-[10px] tracking-widest uppercase">Lumière GastroBar © 2026</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
